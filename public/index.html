<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FileDock — 编辑器 + 文件对比</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1a26'/%3E%3Cpath d='M8.5 4H18l7 7v17a2.5 2.5 0 0 1-2.5 2.5h-14A2.5 2.5 0 0 1 6 28V6.5A2.5 2.5 0 0 1 8.5 4z' fill='%234cc2ff'/%3E%3Cpath d='M18 4l7 7h-7z' fill='%231c74a6'/%3E%3Cpath d='M10 15h10M10 19h10M10 23h6' stroke='%230b1621' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/vendor/codemirror/lib/codemirror.css">
  <link rel="stylesheet" href="/vendor/codemirror/addon/dialog/dialog.css">
  <link rel="stylesheet" href="/vendor/codemirror/addon/fold/foldgutter.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="app">
    <header id="titlebar">
      <div class="brand" title="FileDock">
        <span class="brand-logo">
          <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
            <path d="M8.5 4H18l7 7v17a2.5 2.5 0 0 1-2.5 2.5h-14A2.5 2.5 0 0 1 6 28V6.5A2.5 2.5 0 0 1 8.5 4z" fill="currentColor" opacity=".95"/>
            <path d="M18 4l7 7h-7z" fill="#0b1621" opacity=".45"/>
            <path d="M10 15h10M10 19h10M10 23h6" stroke="#0b1621" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="brand-name">FileDock</span>
      </div>
      <nav id="menubar" aria-label="主菜单"></nav>
      <div class="titlebar-right">
        <button class="icon-btn" id="btnTheme" title="切换主题"></button>
        <button class="icon-btn" id="btnSettings" title="设置 (Ctrl+,)"><span data-icon="settings"></span></button>
      </div>
    </header>

    <div id="toolbar">
      <div class="tool-group">
        <button class="tool-btn" id="btnSidebar" title="显示/隐藏侧边栏 (Ctrl+B)"><span data-icon="panel-left"></span></button>
      </div>
      <div class="tool-sep"></div>
      <div class="tool-group">
        <button class="tool-btn" data-cmd="newFile" title="新建文件 (Ctrl+N)"><span data-icon="file-plus"></span></button>
        <button class="tool-btn" data-cmd="openFile" title="打开文件 (Ctrl+O)"><span data-icon="file-text"></span></button>
        <button class="tool-btn" data-cmd="openFolder" title="打开文件夹 (Ctrl+Shift+O)"><span data-icon="folder-open"></span></button>
        <button class="tool-btn" data-cmd="save" title="保存 (Ctrl+S)"><span data-icon="save"></span></button>
      </div>
      <div class="tool-sep"></div>
      <div class="tool-group">
        <button class="tool-btn" data-cmd="find" title="查找 (Ctrl+F)"><span data-icon="search"></span></button>
        <button class="tool-btn" data-cmd="replace" title="替换 (Ctrl+H)"><span data-icon="replace"></span></button>
        <button class="tool-btn" data-cmd="togglePreview" id="btnPreview" title="预览 Markdown / JSON (Ctrl+Shift+V)" disabled><span data-icon="eye"></span></button>
      </div>
      <div class="breadcrumb" id="breadcrumb">
        <span class="crumb-muted">未打开文件</span>
      </div>
      <div class="tool-group tool-right">
        <button class="tool-btn labeled" data-action="file-search" title="快速查找文件 (Ctrl+P)">
          <span data-icon="file-search"></span><span>查找文件</span>
        </button>
        <button class="tool-btn labeled" data-action="compare-files" title="比较两个文件 (Ctrl+Alt+C)">
          <span data-icon="git-compare"></span><span>比较文件</span>
        </button>
        <button class="tool-btn labeled" data-action="compare-folders" title="比较两个文件夹 (Ctrl+Alt+D)">
          <span data-icon="folder-tree"></span><span>比较文件夹</span>
        </button>
      </div>
    </div>

    <div id="workspace">
      <aside id="sidebar">
        <div class="side-tabs" role="tablist">
          <button class="side-tab active" data-side="explorer" title="资源管理器 (Ctrl+Shift+E)">
            <span data-icon="files"></span><span class="side-tab-label">资源</span>
          </button>
          <button class="side-tab" data-side="search" title="在文件中搜索 (Ctrl+Shift+F)">
            <span data-icon="search"></span><span class="side-tab-label">搜索</span>
          </button>
          <button class="side-tab" data-side="compare" title="比较">
            <span data-icon="git-compare"></span><span class="side-tab-label">比较</span>
          </button>
        </div>

        <div class="side-body">
          <section class="side-panel active" id="panel-explorer">
            <div class="panel-head">
              <span class="panel-title" id="exRootName">资源管理器</span>
              <div class="panel-actions">
                <button class="icon-btn small" id="exNewFile" title="新建文件"><span data-icon="file-plus"></span></button>
                <button class="icon-btn small" id="exNewFolder" title="新建文件夹"><span data-icon="folder-plus"></span></button>
                <button class="icon-btn small" id="exRefresh" title="刷新"><span data-icon="refresh-cw"></span></button>
                <button class="icon-btn small" id="exCollapse" title="全部折叠"><span data-icon="chevrons-up-down"></span></button>
              </div>
            </div>
            <div class="root-bar" id="exRootBar" title="点击更换文件夹">
              <span data-icon="folder-open"></span>
              <span class="root-path" id="exRootPath">未打开文件夹</span>
            </div>
            <div class="tree-scroll">
              <div id="explorerTree" class="tree"></div>
              <div id="explorerEmpty" class="panel-empty" hidden>
                <span data-icon="folder"></span>
                <p>还没有打开文件夹</p>
                <button class="btn primary sm" data-cmd="openFolder">打开文件夹</button>
              </div>
            </div>
          </section>

          <section class="side-panel" id="panel-search">
            <div class="panel-head">
              <span class="panel-title">在文件中搜索</span>
              <button class="icon-btn small" id="searchClear" title="清空结果"><span data-icon="x"></span></button>
            </div>
            <div class="search-form">
              <div class="input-wrap">
                <input id="searchInput" type="text" placeholder="搜索内容…" spellcheck="false" autocomplete="off">
                <button class="icon-btn small in-input" id="searchCase" title="区分大小写"><span data-icon="case-sensitive"></span></button>
                <button class="icon-btn small in-input" id="searchWord" title="全字匹配"><span data-icon="whole-word"></span></button>
                <button class="icon-btn small in-input" id="searchRegex" title="正则表达式"><span data-icon="regex"></span></button>
              </div>
              <details class="search-advanced" id="searchAdvanced">
                <summary>更多选项 <span data-icon="chevron-down"></span></summary>
                <label class="field"><span>包含</span><input id="searchInclude" placeholder="* 或 *.js, src/**" spellcheck="false"></label>
                <label class="field"><span>排除</span><input id="searchExclude" placeholder="node_modules/**, .git/**" spellcheck="false"></label>
                <label class="check"><input type="checkbox" id="searchReplaceToggle"> 同时替换</label>
                <div class="replace-row" id="replaceRow" hidden>
                  <input id="searchReplace" placeholder="替换为…" spellcheck="false">
                  <button class="btn sm" id="replaceAllBtn">全部替换</button>
                </div>
              </details>
              <button class="btn primary block" id="searchBtn"><span data-icon="search"></span>搜索</button>
            </div>
            <div class="search-summary" id="searchSummary"></div>
            <div class="search-results" id="searchResults"></div>
          </section>

          <section class="side-panel" id="panel-compare">
            <div class="panel-head"><span class="panel-title">比较</span></div>
            <div class="compare-cards">
              <button class="compare-card" data-action="compare-files">
                <span class="cc-icon" data-icon="git-compare"></span>
                <span class="cc-text"><b>比较文件</b><small>并排查看两个文件的差异</small></span>
                <span class="cc-key">⌘/Ctrl+Alt+C</span>
              </button>
              <button class="compare-card" data-action="compare-folders">
                <span class="cc-icon" data-icon="folder-tree"></span>
                <span class="cc-text"><b>比较文件夹</b><small>递归对比目录结构与内容</small></span>
                <span class="cc-key">⌘/Ctrl+Alt+D</span>
              </button>
            </div>
            <div class="panel-subhead"><span>最近的比较</span><button class="link-btn" id="clearRecentCompares">清除</button></div>
            <div id="recentCompares" class="recent-list"></div>
            <div class="tip-card">
              <span data-icon="sparkles"></span>
              <div>
                <b>小提示</b>
                <p>在资源管理器中右键文件，可以「选择比较」或直接与另一个文件对比；对比视图里用 <kbd>Alt</kbd> + <kbd>↓</kbd> / <kbd>↑</kbd> 跳转差异。</p>
              </div>
            </div>
          </section>
        </div>
      </aside>

      <div id="sidebarResizer" title="拖动调整宽度"></div>

      <main id="main">
        <div id="tabstrip" class="tabstrip"></div>
        <div id="content">
          <section id="welcome" class="welcome">
            <div class="welcome-hero">
              <div class="hero-logo">
                <svg viewBox="0 0 64 64" width="70" height="70" aria-hidden="true">
                  <path d="M17 8h19l14 14v34a5 5 0 0 1-5 5H17a5 5 0 0 1-5-5V13a5 5 0 0 1 5-5z" fill="var(--accent)" opacity=".95"/>
                  <path d="M36 8l14 14H36z" fill="#08131d" opacity=".34"/>
                  <path d="M22 30h20M22 38h20M22 46h12" stroke="#08131d" stroke-width="3.4" stroke-linecap="round" opacity=".88"/>
                </svg>
              </div>
              <h1>FileDock</h1>
              <p class="hero-sub">把文件停靠进来：编辑、对比、快速查找，全在本地完成。</p>
              <div class="hero-actions">
                <button class="btn primary" data-cmd="newFile"><span data-icon="file-plus"></span>新建文件</button>
                <button class="btn" data-cmd="openFolder"><span data-icon="folder-open"></span>打开文件夹</button>
                <button class="btn" data-action="file-search"><span data-icon="file-search"></span>查找文件</button>
                <button class="btn" data-action="compare-files"><span data-icon="git-compare"></span>比较文件</button>
                <button class="btn" data-action="compare-folders"><span data-icon="folder-tree"></span>比较文件夹</button>
                <button class="btn ghost" data-action="open-demo"><span data-icon="sparkles"></span>打开示例对比</button>
              </div>
              <p class="hero-hint">也可以把文件或文件夹直接拖进窗口</p>
            </div>
            <div class="welcome-grid">
              <div class="welcome-card">
                <h3><span data-icon="history"></span>最近的文件</h3>
                <div id="welcomeRecentFiles" class="recent-files"></div>
              </div>
              <div class="welcome-card">
                <h3><span data-icon="keyboard"></span>快捷键</h3>
                <ul class="shortcut-list">
                  <li><span>快速查找文件</span><kbd>Ctrl</kbd><kbd>P</kbd></li>
                  <li><span>命令面板</span><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>P</kbd></li>
                  <li><span>查找 / 替换</span><kbd>Ctrl</kbd><kbd>F</kbd> / <kbd>H</kbd></li>
                  <li><span>保存</span><kbd>Ctrl</kbd><kbd>S</kbd></li>
                  <li><span>下一个差异</span><kbd>Alt</kbd><kbd>↓</kbd></li>
                </ul>
              </div>
              <div class="welcome-card wide">
                <h3><span data-icon="folder"></span>最近打开的文件夹</h3>
                <div id="welcomeRecentRoots" class="recent-files horizontal"></div>
              </div>
            </div>
          </section>

          <section id="editorPane" class="pane" hidden>
            <div id="editorHost"><textarea id="editor" spellcheck="false"></textarea></div>
            <div id="previewHost" class="preview-host" hidden></div>
          </section>

          <section id="comparePane" class="pane" hidden></section>
        </div>
      </main>
    </div>

    <footer id="statusbar">
      <div class="status-left">
        <span id="statusPath" class="status-path">就绪</span>
      </div>
      <div class="status-right">
        <button class="status-item" id="statCursor" title="光标位置">行 1，列 1</button>
        <button class="status-item" id="statSel" title="选中字符数" hidden></button>
        <button class="status-item" id="statIndent" title="缩进设置">空格: 4</button>
        <button class="status-item" id="statEncoding" title="文件编码">UTF-8</button>
        <button class="status-item" id="statEol" title="换行符">LF</button>
        <button class="status-item" id="statLang" title="语法模式">纯文本</button>
        <button class="status-item" id="statSize" title="文件大小"></button>
        <span class="status-dot" id="statDirty" title="未保存" hidden></span>
      </div>
    </footer>
  </div>

  <!-- CodeMirror -->
  <script src="/vendor/codemirror/lib/codemirror.js"></script>
  <script src="/vendor/codemirror/addon/search/searchcursor.js"></script>
  <script src="/vendor/codemirror/addon/search/search.js"></script>
  <script src="/vendor/codemirror/addon/search/jump-to-line.js"></script>
  <script src="/vendor/codemirror/addon/search/match-highlighter.js"></script>
  <script src="/vendor/codemirror/addon/dialog/dialog.js"></script>
  <script src="/vendor/codemirror/addon/edit/closebrackets.js"></script>
  <script src="/vendor/codemirror/addon/edit/matchbrackets.js"></script>
  <script src="/vendor/codemirror/addon/edit/closetag.js"></script>
  <script src="/vendor/codemirror/addon/edit/trailingspace.js"></script>
  <script src="/vendor/codemirror/addon/selection/active-line.js"></script>
  <script src="/vendor/codemirror/addon/fold/foldcode.js"></script>
  <script src="/vendor/codemirror/addon/fold/foldgutter.js"></script>
  <script src="/vendor/codemirror/addon/fold/brace-fold.js"></script>
  <script src="/vendor/codemirror/addon/comment/comment.js"></script>
  <script src="/vendor/codemirror/addon/display/placeholder.js"></script>

  <script src="/vendor/codemirror/addon/mode/simple.js"></script>

  <script src="/vendor/codemirror/mode/xml/xml.js"></script>
  <script src="/vendor/codemirror/mode/javascript/javascript.js"></script>
  <script src="/vendor/codemirror/mode/css/css.js"></script>
  <script src="/vendor/codemirror/mode/htmlmixed/htmlmixed.js"></script>
  <script src="/vendor/codemirror/mode/markdown/markdown.js"></script>
  <script src="/vendor/codemirror/mode/python/python.js"></script>
  <script src="/vendor/codemirror/mode/clike/clike.js"></script>
  <script src="/vendor/codemirror/mode/sql/sql.js"></script>
  <script src="/vendor/codemirror/mode/shell/shell.js"></script>
  <script src="/vendor/codemirror/mode/yaml/yaml.js"></script>
  <script src="/vendor/codemirror/mode/go/go.js"></script>
  <script src="/vendor/codemirror/mode/rust/rust.js"></script>
  <script src="/vendor/codemirror/mode/php/php.js"></script>
  <script src="/vendor/codemirror/mode/properties/properties.js"></script>
  <script src="/vendor/codemirror/mode/diff/diff.js"></script>
  <script src="/vendor/codemirror/mode/powershell/powershell.js"></script>
  <script src="/vendor/codemirror/mode/lua/lua.js"></script>
  <script src="/vendor/codemirror/mode/dockerfile/dockerfile.js"></script>
  <script src="/vendor/codemirror/mode/toml/toml.js"></script>
  <script src="/vendor/codemirror/mode/vb/vb.js"></script>
  <script src="/vendor/codemirror/mode/swift/swift.js"></script>
  <script src="/vendor/codemirror/mode/perl/perl.js"></script>
  <script src="/vendor/codemirror/mode/r/r.js"></script>
  <script src="/vendor/codemirror/mode/sass/sass.js"></script>
  <script src="/vendor/codemirror/mode/groovy/groovy.js"></script>
  <script src="/vendor/codemirror/mode/coffeescript/coffeescript.js"></script>
  <script src="/vendor/codemirror/mode/clojure/clojure.js"></script>
  <script src="/vendor/codemirror/mode/dart/dart.js"></script>

  <!--APP_CONFIG-->
  <script src="/js/bridge.js"></script>
  <div id="modals"></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
